services:
  api:
    build: ./api
    volumes:
      - ./api/data:/app/data   # сюди можна покласти train.csv з Kaggle
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build: ./web
    ports: ["3000:80"]
    depends_on: [api]
